<script type="module">
import * as THREE from "three";
import { PointerLockControls } from "three/addons/controls/PointerLockControls.js";

// ---------- Audio ----------
let ac = null;
const initAudio = () => { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); };
function bip(type, f1, f2, dur, vol) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.01, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(t + dur);
}
let bruit = null;
function noise(dur, vol, fc) {
  if (!ac) return;
  if (!bruit) { bruit = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = bruit.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
  s.buffer = bruit; f.type = "lowpass";
  f.frequency.setValueAtTime(fc, t); f.frequency.exponentialRampToValueAtTime(100, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.01, t + dur);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t + dur);
}
const sonTir = () => { noise(.18, .5, 3500); bip("sine", 150, 40, .15, .5); };
const sonPompe = () => { noise(.28, .65, 1800); bip("sawtooth", 90, 30, .22, .45); };
const sonRecharge = () => { bip("square", 900, 500, .05, .12); setTimeout(() => bip("square", 500, 900, .06, .12), 700); setTimeout(() => noise(.08, .3, 2500), 1000); };
const sonTouche = () => bip("triangle", 1200, 600, .07, .2);
const sonDegat = () => bip("sawtooth", 120, 50, .25, .35);
const sonBonus = () => bip("sine", 600, 1200, .18, .2);

// ---------- Réglages ----------
const DUREE = 90, VIES = 1, L = 50, HJ = 1.7, ETAGE = 3.2, CELL = .5, PC = 4;
const lire = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } };
const ecrire = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lumieres = [];

// ---------- Scène ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f18);
scene.fog = new THREE.FogExp2(0x0e1219, .03);   // brouillard de nuit (réduit dans les maisons)
let dansMaison = false;
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 250);
scene.add(camera);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
let Q = +lire("nuketown_q", 1);
function qualite(q) {
  Q = q; ecrire("nuketown_q", q);
  renderer.setPixelRatio([.6, 1, Math.min(devicePixelRatio, 2)][q]);
  renderer.setSize(innerWidth, innerHeight);
  scene.fog.density = dansMaison ? .002 : [.045, .03, .02][q];
  camera.far = [90, 130, 250][q];
  lumieres.forEach((l, i) => (l.visible = q > 0 || i % 2 === 0));
  camera.updateProjectionMatrix();
}
qualite(Q);
scene.add(new THREE.HemisphereLight(0x4a5a7a, 0x1a1a1a, .65));
const lune = new THREE.DirectionalLight(0x8fa8ff, .7);
lune.position.set(-30, 60, 20); scene.add(lune);
const lampe = new THREE.SpotLight(0xfff1d0, 500, 45, .45, .6, 1.4);   // lampe torche (touche F)
lampe.position.set(0, 0, 0); lampe.target.position.set(0, 0, -1);
camera.add(lampe, lampe.target);
const astre = new THREE.Mesh(new THREE.SphereGeometry(9, 16, 16), new THREE.MeshBasicMaterial({ color: 0xdfe8ff, fog: false }));
astre.position.set(-120, 110, -160); scene.add(astre);
const lumieresAmbiance = [];
function ajouterLumiere(couleur, intensite, distance, x, y, z, variation = .08) {
  const l = new THREE.PointLight(couleur, intensite, distance, 2);
  l.userData = {
    base: intensite,
    scint: !!variation,
    phase: Math.random() * Math.PI * 2,
    phaseLente: Math.random() * Math.PI * 2,
    vitesseScint: .7 + Math.random() * .9,
    amplitudeScint: .025 + Math.random() * .045,
    scintillementBref: 0,
    prochainScintillement: 2 + Math.random() * 6
  };
  l.visible = Q > 0 || lumieres.length % 2 === 0;
  l.position.set(x, y, z); scene.add(l);
  lumieres.push(l);
  lumieresAmbiance.push({ lumiere: l, intensite, variation, phase: Math.random() * Math.PI * 2 });
  return l;
}

// ---------- Matériaux (textures dessinées par le code) ----------
const cache = {};
function mat(type, couleur, rx = 1, ry = 1) {
  const k = type + couleur + rx + ry;
  if (cache[k]) return cache[k];
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = couleur; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 600; i++) {
    g.fillStyle = Math.random() < .5 ? "rgba(0,0,0,.06)" : "rgba(255,255,255,.06)";
    g.fillRect(Math.random() * 128, Math.random() * 128, 3, 3);
  }
  g.strokeStyle = "rgba(0,0,0,.3)"; g.lineWidth = 2;
  const ligne = (a, b, c2, d) => { g.beginPath(); g.moveTo(a, b); g.lineTo(c2, d); g.stroke(); };
  if (type === "bardage") for (let y = 0; y < 128; y += 12) ligne(0, y, 128, y);
  else if (type === "toit") for (let y = 0; y < 128; y += 8) ligne(0, y, 128, y);
  else if (type === "parquet" || type === "palissade") for (let x = 0; x < 128; x += 16) ligne(x, 0, x, 128);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  return (cache[k] = new THREE.MeshStandardMaterial({ map: t }));
}
const cu = {};
const uni = (c) => cu[c] || (cu[c] = new THREE.MeshStandardMaterial({ color: c }));
const verre = new THREE.MeshStandardMaterial({ color: 0x9fd3ee, transparent: true, opacity: .35 });

// ---------- Collisions ----------
const obstacles = [], solides = [], maisons = [];
// Grille spatiale : on ne teste que les obstacles proches
const seaux = new Map(), VIDE = [];
const cle = (ix, iz) => ix * 100 + iz;
const cellule = (v) => Math.floor((v + L + 10) / PC);
const proches = (x, z) => seaux.get(cle(cellule(x), cellule(z))) || VIDE;

// sol = true : bloque joueur et tirs | "tir" : bloque seulement les tirs | false : décor
function addBox(x, y, z, w, h, d, m, sol = true) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  b.position.set(x, y, z);
  b.matrixAutoUpdate = false; b.updateMatrix(); // objet fixe : pas de recalcul à chaque image
  scene.add(b);
  if (sol) solides.push(b);
  if (sol === true) {
    const o = { minX: x - w / 2, maxX: x + w / 2, minY: y - h / 2, maxY: y + h / 2, minZ: z - d / 2, maxZ: z + d / 2 };
    obstacles.push(o);
    for (let ix = cellule(o.minX - 1.5); ix <= cellule(o.maxX + 1.5); ix++)
      for (let iz = cellule(o.minZ - 1.5); iz <= cellule(o.maxZ + 1.5); iz++) {
        const k = cle(ix, iz);
        if (!seaux.has(k)) seaux.set(k, []);
        seaux.get(k).push(o);
      }
  }
  return b;
}
// fy = hauteur des pieds : un obstacle ne gêne que s'il est à la hauteur du corps
function pousser(pos, r, fy, haut = 1.7) {
  let touche = false;
  for (const o of proches(pos.x, pos.z)) {
    if (!(o.minY < fy + haut && o.maxY > fy + .25)) continue;
    const cx = Math.max(o.minX, Math.min(pos.x, o.maxX));
    const cz = Math.max(o.minZ, Math.min(pos.z, o.maxZ));
    const dx = pos.x - cx, dz = pos.z - cz, d = Math.hypot(dx, dz);
    if (d < r) {
      touche = true;
      if (d > .0001) { pos.x = cx + dx / d * r; pos.z = cz + dz / d * r; }
      else {
        const m = Math.min(pos.x - o.minX, o.maxX - pos.x, pos.z - o.minZ, o.maxZ - pos.z);
        if (m === pos.x - o.minX) pos.x = o.minX - r;
        else if (m === o.maxX - pos.x) pos.x = o.maxX + r;
        else if (m === pos.z - o.minZ) pos.z = o.minZ - r;
        else pos.z = o.maxZ + r;
      }
    }
  }
  return touche;
}
const libre = (x, z, mg, fy = 0) => !proches(x, z).some((o) =>
  o.minY < fy + 1.7 && o.maxY > fy + .35 && x > o.minX - mg && x < o.maxX + mg && z > o.minZ - mg && z < o.maxZ + mg);

const maisonDe = (x, z) => maisons.find((m) => Math.abs(x - m.cx) < 10 && Math.abs((z - m.zc) * m.s) < 7);
const interieurDe = (x, z) => maisons.find((m) => Math.abs(x - m.cx) < 9.5 && Math.abs((z - m.zc) * m.s) < 6.5);

// Hauteur du sol : escalier (rampe), étage, ou rez-de-chaussée
function hauteurSol(x, z, fy) {
  let h = 0;
  for (const m of maisons) {
    const lx = x - m.cx, lf = (z - m.zc) * m.s;
    if (Math.abs(lx) < 10 && Math.abs(lf) < 7) {
      if (lx > 7 && lf < 2) { if (lf > -6) h = Math.max(h, (lf + 6) / 8 * ETAGE); }
      else if (fy > ETAGE - .8) h = ETAGE;
    }
  }
  return h;
}

// ---------- Terrain ----------
const sol = new THREE.Mesh(new THREE.PlaneGeometry(2 * L + 40, 2 * L + 40), mat("herbe", "#558b2f", 30, 30));
sol.rotation.x = -Math.PI / 2; scene.add(sol);
const route = new THREE.Mesh(new THREE.PlaneGeometry(2 * L, 16), mat("asphalte", "#37474f", 12, 2));
route.rotation.x = -Math.PI / 2; route.position.y = .02; scene.add(route);
for (let x = -L + 4; x < L; x += 8) {
  const l = new THREE.Mesh(new THREE.PlaneGeometry(4, .4), new THREE.MeshBasicMaterial({ color: 0xffeb3b }));
  l.rotation.x = -Math.PI / 2; l.position.set(x, .03, 0); scene.add(l);
}
[-9, 9].forEach((z) => addBox(0, .05, z, 2 * L, .1, 2, uni(0xb0b0b0), false)); // trottoirs

// Palissade autour de la carte
const bordure = mat("palissade", "#8d6e63", 20, 1);
addBox(0, 1.75, -L - .25, 2 * L + 1, 3.5, .5, bordure);
addBox(0, 1.75, L + .25, 2 * L + 1, 3.5, .5, bordure);
addBox(-L - .25, 1.75, 0, .5, 3.5, 2 * L + 1, bordure);
addBox(L + .25, 1.75, 0, .5, 3.5, 2 * L + 1, bordure);

// ---------- Maisons à étage ----------
// s = +1 : façade vers +z (maison nord) | s = -1 : façade vers -z (maison sud)
// lx = position sur la largeur, lf = distance depuis le centre vers la façade
function maison(cx, zc, s, cMur, cToit, cInt) {
  maisons.push({ cx, zc, s });
  const W = 20, D = 14, E = .3, H = ETAGE;
  const mur = mat("bardage", cMur, 5, 1.5), parq = mat("parquet", "#c9a77c", 5, 3), cl = mat("bardage", cInt, 3, 1);
  const box = (lx, lf, y0, y1, sx, sf, mt, so = true) => addBox(cx + lx, (y0 + y1) / 2, zc + s * lf, sx, y1 - y0, sf, mt, so);

  // Mur avec ouvertures [de, à, bas, haut, vitre] (hauteurs relatives à y0)
  function murs(axe, fixe, a, b, y0, y1, ops, mt) {
    const seg = (u, v, h0, h1) => {
      if (v - u < .01 || h1 - h0 < .01) return;
      axe === "x" ? box((u + v) / 2, fixe, h0, h1, v - u, E, mt) : box(fixe, (u + v) / 2, h0, h1, E, v - u, mt);
    };
    let cur = a;
    for (const [u, v, bas, haut, vit] of ops.slice().sort((p, q) => p[0] - q[0])) {
      seg(cur, u, y0, y1); seg(u, v, y0, y0 + bas); seg(u, v, y0 + haut, y1);
      if (vit) axe === "x" ? box((u + v) / 2, fixe, y0 + bas, y0 + haut, v - u, .06, verre, false)
                           : box(fixe, (u + v) / 2, y0 + bas, y0 + haut, .06, v - u, verre, false);
      cur = v;
    }
    seg(cur, b, y0, y1);
  }
  const porte = (u, v) => [u, v, 0, 2.4, false], fen = (u, v) => [u, v, .9, 2.3, true];

  // Façade, arrière et côtés (rez-de-chaussée puis étage)
  [[0, H], [H, 2 * H]].forEach(([y0, y1], n) => {
    murs("x", 7, -10, 10, y0, y1, n ? [fen(-8, -5), fen(-2, 2), fen(4, 6)] : [porte(-1, 1), fen(-8, -5), fen(4, 6)], mur);
    murs("x", -7, -10, 10, y0, y1, n ? [fen(-8, -5), fen(2, 5)] : [porte(-2, 0), fen(-8, -5), fen(3, 6)], mur);
    [-10, 10].forEach((lx) => murs("f", lx, -7, 7, y0, y1, [fen(-4, -1), fen(2, 5)], mur));
  });

  // Pièces du rez-de-chaussée
  murs("f", -3, -7, 7, 0, H, [porte(-4, -2), porte(3, 5)], cl);
  murs("x", 0, -10, -3, 0, H, [porte(-7.5, -5.5)], cl);
  box(7, -1.5, 0, H, .2, 7, cl);                 // flanc de l'escalier (entrée par le bas)
  // Pièces de l'étage
  murs("x", 0, -10, 7, H, 2 * H, [porte(-7.5, -5.5), porte(2, 4)], cl);
  murs("f", -1, -7, 0, H, 2 * H, [porte(-4.5, -2.5)], cl);
  box(7, -2.5, H, H + 1, .1, 9, cl);             // rambarde autour de l'escalier

  // Sols, plancher d'étage (trou pour l'escalier) et plafond
  const sRdc = new THREE.Mesh(new THREE.PlaneGeometry(W - .6, D - .6), parq);
  sRdc.rotation.x = -Math.PI / 2; sRdc.position.set(cx, .04, zc); scene.add(sRdc);
  box(-1.5, 0, H - .2, H, 17, 14, parq, "tir");
  box(8.5, 4.5, H - .2, H, 3, 5, parq, "tir");
  box(0, 0, 2 * H, 2 * H + .2, W, D, uni(0xeeeeee), "tir");

  const bois = uni(0x49372d), tissu = uni(0x4d5156), tissuClair = uni(0x777064);
  const matelas = uni(0xaaa18d), metal = uni(0x33383a), eclat = uni(0xffc979);
  const lit = (lx, lf, niveau, largeur = 2.2, longueur = 2.8) => {
    box(lx, lf, niveau + .18, niveau + .48, largeur, longueur, bois);
    box(lx, lf, niveau + .48, niveau + .7, largeur - .12, longueur - .12, matelas, false);
    box(lx, lf + longueur * .28, niveau + .7, niveau + .78, largeur - .35, .5, uni(0xd3c9b4), false);
    box(lx, lf + longueur / 2 - .06, niveau + .25, niveau + 1.35, largeur + .12, .14, bois, false);
  };
  const canape = (lx, lf) => {
    box(lx, lf, .18, .48, 3.2, .95, bois);
    box(lx, lf, .48, .88, 3, .82, tissu);
    box(lx, lf + .36, .82, 1.38, 3, .2, tissu);
    [-1.48, 1.48].forEach((dx) => box(lx + dx, lf, .5, 1.05, .24, 1.05, tissu));
  };
  const table = (lx, lf, niveau, largeur, profondeur) => {
    box(lx, lf, niveau + .68, niveau + .84, largeur, profondeur, bois);
    [-1, 1].forEach((dx) => [-1, 1].forEach((dz) =>
      box(lx + dx * (largeur / 2 - .12), lf + dz * (profondeur / 2 - .12), niveau, niveau + .68, .14, .14, bois)));
  };
  const chaise = (lx, lf, niveau) => {
    box(lx, lf, niveau + .42, niveau + .55, .58, .58, bois);
    box(lx, lf + .24, niveau + .55, niveau + 1.12, .58, .12, tissu);
    [-.21, .21].forEach((dx) => [-.21, .21].forEach((dz) =>
      box(lx + dx, lf + dz, niveau, niveau + .42, .09, .09, bois)));
  };
  const commode = (lx, lf, niveau, largeur = 1.5) => {
    box(lx, lf, niveau, niveau + 1.25, largeur, .55, bois);
    [niveau + .42, niveau + .82].forEach((y) =>
      box(lx, lf - .29, y, y + .05, largeur - .16, .035, tissuClair, false));
  };
  const etagere = (lx, lf, niveau, largeur = 1.6) => {
    box(lx, lf, niveau, niveau + 1.9, largeur, .42, bois);
    [niveau + .52, niveau + 1.08, niveau + 1.64].forEach((y) =>
      box(lx, lf, y, y + .09, largeur, .48, bois, false));
    [-.48, 0, .48].forEach((dx, i) =>
      box(lx + dx, lf - .25, niveau + .84 + (i % 2) * .16, niveau + 1.25 + (i % 2) * .16, .22, .18,
        [uni(0x75614a), uni(0x58636a), uni(0x776052)][i], false));
  };

  // Rez-de-chaussée, avant gauche : salon, meubles regroupés autour de la table basse.
  canape(-5.4, 4.65);
  table(-5.4, 2.8, 0, 1.35, .8);
  commode(-5.4, -2.57, .08, 2.2);
  box(-5.4, -2.53, 1.02, 2.17, 1.35, .12, metal, false);
  box(-5.4, -2.45, 1.12, 1.95, .92, .04, uni(0x657c84), false);

  // Rez-de-chaussée, avant droite : table et quatre chaises, hors du passage vers l'escalier.
  table(4.6, 4.55, 0, 2.4, 1.25);
  chaise(2.95, 4.55, 0); chaise(6.25, 4.55, 0);
  chaise(4.6, 3.55, 0); chaise(4.6, 5.55, 0);

  // Rez-de-chaussée, arrière droite : plan de travail le long du mur intérieur.
  [-4.1, -5.25, -6.35].forEach((lf) => {
    box(.85, lf, 0, .9, .92, .76, bois);
    box(.85, lf, .9, 1.02, .98, .82, uni(0x777773), false);
  });
  box(2.05, -5.55, 0, 1.85, 1.05, 1.05, metal);
  box(2.05, -5.55, 1.85, 2.02, 1.1, 1.1, bois, false);
  box(.85, -4.1, 1.04, 1.22, .38, .28, uni(0x34383a), false);

  // Rez-de-chaussée, arrière gauche : petite chambre, avec un dégagement devant la porte.
  lit(-2.8, -5.35, 0, 2.15, 2.65);
  commode(-6.9, -4.35, 0, 1.35);

  // Étage, avant gauche : chambre et rangement contre les murs pleins.
  lit(-5.25, 4.2, H);
  commode(-1.35, 5.35, H, 1.35);

  // Étage, arrière gauche : bureau, chaise et bibliothèque sans bloquer l'accès.
  box(-4.1, -2.2, H + .68, H + .84, 2.2, .9, bois);
  chaise(-4.1, -3.35, H);
  etagere(-7.1, -3.8, H, 1.5);

  // Étage, côté droit : chambre à l'avant et coin lecture à l'arrière, loin de la trémie.
  lit(3.8, 4.45, H, 2.25, 2.7);
  commode(8.7, 5.6, H, 1.45);
  etagere(5.35, -4.5, H, 1.5);
  chaise(2.5, -4.5, H);
  table(2.5, -5.6, H, .65, .65);
  box(2.5, -5.6, H + .86, H + 1.22, .28, .28, uni(0xffd79c), false);
  [H - .42, 2 * H - .42].forEach((y) => {
    box(0, 1, y, y + .1, .9, .65, metal, false);
    box(0, 1, y + .1, y + .18, .42, .3, eclat, false);
  });
  ajouterLumiere(0xffb86b, 1.05, 10, cx, 2.75, zc + s * 1, .18);
  ajouterLumiere(0xffc982, .8, 9, cx, H + 2.75, zc + s * 1, .14);

  // Escalier : 16 marches, de lf = -6 à lf = +2
  for (let i = 0; i < 16; i++) box(8.5, -6 + i * .5 + .25, 0, (i + 1) * .2, 2.8, .5, parq, "tir");

  {
    // ---- Lumières intérieures ----

const GM = { torse: new THREE.BoxGeometry(.6, .8, .3), tete: new THREE.SphereGeometry(.22, 12, 12), jambe: new THREE.BoxGeometry(.22, .8, .25), bras: new THREE.BoxGeometry(.15, .7, .15), arme: new THREE.BoxGeometry(.08, .1, .6) };
function creerMannequin(couleur, type, bas = couleur, peau = 0xffcc80) {
  const g = new THREE.Group(), h = uni(couleur), p = uni(peau), b = uni(bas);
  const piece = (geo, m, x, y, parent) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, 0); parent.add(o); return o; };
  const pivot = (x, y, parent) => { const o = new THREE.Group(); o.position.set(x, y, 0); parent.add(o); return o; };
  const haut = pivot(0, .8, g);                               // tout le haut du corps pivote autour des hanches
  piece(GM.torse, h, 0, .4, haut);
  const tete = pivot(0, .65, haut); piece(GM.tete, p, 0, .4, tete);
  const bg = pivot(-.4, .75, haut), bd = pivot(.4, .75, haut);  // épaules
  piece(GM.bras, h, 0, -.35, bg); piece(GM.bras, h, 0, -.35, bd);
  const jg = pivot(-.15, .8, g), jd = pivot(.15, .8, g);        // hanches
  piece(GM.jambe, b, 0, -.4, jg); piece(GM.jambe, b, 0, -.4, jd);
  g.userData = { type, rig: { haut, tete, bg, bd, jg, jd } };
  return g;
}

const N = 2 * L / CELL, DX = [1, -1, 0, 0, 1, 1, -1, -1], DZ = [0, 0, 1, -1, 1, -1, 1, -1];

function calculerChamp() {   // distance de chaque case jusqu'au joueur
  const g = grilles[niveau];
  champ.fill(-1);

      const n = j * N + i;
      if (!g[n] || champ[n] >= 0) continue;
      if (DX[k] && DZ[k] && !(g[cj2 * N + i] && g[j * N + ci2])) continue; // pas de coin coupé

  const c = cj * N + ci;

  let meilleur = -1, bd = champ[c] >= 0 ? champ[c] : 1e9;

    const i = ci + DX[k], j = cj + DZ[k];
    if (i < 0 || j < 0 || i >= N || j >= N) continue;
    const n = j * N + i;
    if (champ[n] < 0 || champ[n] >= bd) continue;
    if (DX[k] && DZ[k] && !(g[cj * N + i] && g[j * N + ci])) continue;

}
function afficher() {
  maj("score", score); maj("highscore", record); maj("vies", vies);
  maj("munitions", tricheMunitions ? "∞" : chargeurs[armeIdx]);
  maj("reserve", tricheMunitions ? "∞" : reserves[armeIdx]); maj("nom-arme", ARMES[armeIdx].nom);
  maj("temps", mode === "vagues" ? "Vague " + vague + " (" + (nbVague() - tues) + " restants)" : "Temps : " + Math.ceil(temps) + " s");
  const boss = ennemis.find((e) => e.userData.sorte === "boss");
  maj("boss-ligne", boss ? "⚠ BOSS" : "");
}
function reinitialiser() {
  [...cibles, ...ennemis].forEach((o) => scene.remove(o));
  cibles.length = 0; ennemis.length = 0;
  projectiles.forEach((b) => scene.remove(b)); projectiles.length = 0;
  cadavres.forEach((c) => scene.remove(c)); cadavres.length = 0;
  score = 0; vies = VIES; temps = DUREE; fin = false; niveau = 0;
  vague = 1; spawnes = 0; tues = 0; pauseVague = 0; champT = 0; bossCetteVague = false;
  delaiEnnemi = 2; enRechargement = false;
  armeIdx = 0; chargeurs = [30, 6]; reserves = [90, 18];
  hCam = HJ; vy = 0; auSol = true; boostVit = 0; clicMaintenu = false; poseCourse = 0; phaseCourse = 0;
  record = +lire(cleRecord(), 0);
  $("etat-arme").textContent = "Prêt";
  camera.position.set(2, HJ, -2);
  if (mode === "chrono") for (let i = 0; i < 8; i++) creerCible();
  afficher();
  if (mode === "vagues") montrer("VAGUE 1 !");
}
function terminer(raison) {
  fin = true;
  const nouveau = score > record;
  if (nouveau) { record = score; ecrire(cleRecord(), score); }
  ecranMenu(`${raison}<br>Score : ${score}${mode === "vagues" ? " · Vague " + vague : ""} · ${nouveau ? "NOUVEAU RECORD !" : "Record : " + record}`, false);
  controls.unlock();
}
afficher();

function lancerRechargement() {
  const A = ARMES[armeIdx];
  if (tricheMunitions || reserves[armeIdx] <= 0 || chargeurs[armeIdx] >= A.mag) return;
  enRechargement = true; debutRecharge = performance.now(); $("etat-arme").textContent = "Rechargement..."; sonRecharge();
  setTimeout(() => {
    if (!fin) {
      const manque = A.mag - chargeurs[armeIdx], pris = Math.min(manque, reserves[armeIdx]);
      chargeurs[armeIdx] += pris; reserves[armeIdx] -= pris;
      $("etat-arme").textContent = "Prêt"; afficher();
    }
    enRechargement = false;
  }, 1200);
}

// ---------- Tir ----------
const raycaster = new THREE.Raycaster();
let recul = 0;
// Impacts sur les murs : 40 marques réutilisées en boucle
const impacts = [], matImpact = new THREE.MeshBasicMaterial({ color: 0x111111 }), geoImpact = new THREE.CircleGeometry(.09, 8);
let iImpact = 0, tFlash = 0;
function impact(t) {
  const k = iImpact++ % 40;
  if (!impacts[k]) { impacts[k] = new THREE.Mesh(geoImpact, matImpact); scene.add(impacts[k]); }
  const n = t.face.normal.clone().transformDirection(t.object.matrixWorld), d = impacts[k];
  d.position.copy(t.point).addScaledVector(n, .02);
  d.lookAt(t.point.clone().add(n));
}
// Projectiles des zombies militaires : boules roses lumineuses, lentes (13 u/s contre 8 pour toi de course... esquivables)
const projectiles = [], geoBalle = new THREE.SphereGeometry(.22, 10, 10), geoHalo = new THREE.SphereGeometry(.5, 10, 10);
const matBalle = new THREE.MeshBasicMaterial({ color: 0xff2bd6, fog: false });
const matHalo = new THREE.MeshBasicMaterial({ color: 0xff2bd6, transparent: true, opacity: .3, fog: false });
function tirerBalle(o, dir) {
  const b = new THREE.Mesh(geoBalle, matBalle);
  b.add(new THREE.Mesh(geoHalo, matHalo));
  b.position.copy(o);
  b.userData = { v: dir.clone().multiplyScalar(13), vie: 4 };
  scene.add(b); projectiles.push(b);
  bip("square", 600, 200, .12, .15);
}
function blesser() {   // renvoie true si la partie est finie
  if (tricheInvincible) return false;
  vies--; sonDegat();
  degats.style.opacity = 1; setTimeout(() => (degats.style.opacity = 0), 150);
  if (vies <= 0) { afficher(); terminer("Tu as été éliminé !"); return true; }
  return false;
}
function tuerCible(obj, tete) {
  scene.remove(obj);
  cibles.splice(cibles.indexOf(obj), 1);
  const pts = tete ? 100 : 50;
  score += pts; sonTouche(); creerCible();
  montrer((tete ? "HEADSHOT +" : "CORPS +") + pts, 200);
}
const cadavres = [], qCh = new THREE.Quaternion(), axeCh = new THREE.Vector3();
function mourir(obj, tete) {   // le zombie devient un ragdoll qui reste 20 s
  ennemis.splice(ennemis.indexOf(obj), 1); tues++;
  const R = obj.userData.rig, r = Math.random;
  let dx = obj.position.x - camera.position.x, dz = obj.position.z - camera.position.z;
  const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;                // il tombe en s'éloignant du joueur
  const membres = ["bg", "bd", "jg", "jd", "cg", "cd", "tete"].map((k) => ({
    o: R[k], x0: R[k].rotation.x, z0: R[k].rotation.z, xr: (r() - .5) * 2.4, zr: (r() - .5) * 1.2, f: 7 + r() * 5 }));
  membres[6].xr = tete ? -1.1 : .6 + r() * .5;                        // tête renversée si headshot
  obj.userData.mort = { t: 0, dx, dz, ang: 0, vel: 1.2 + r() * 1.2, max: 1.45 + r() * .1, yaw: obj.quaternion.clone(), y0: obj.position.y, s0: obj.scale.x, membres };
  cadavres.push(obj);
  if (cadavres.length > 30) scene.remove(cadavres.shift());
}
function animerCadavres(dt) {
  for (let i = cadavres.length - 1; i >= 0; i--) {
    const o = cadavres[i], m = o.userData.mort;
    m.t += dt;
    if (m.t > 20) { scene.remove(o); cadavres.splice(i, 1); continue; }
    if (!m.fini) {   // chute : le corps bascule, rebondit un peu, puis reste au sol
      m.vel += 16 * dt * Math.sin(Math.min(m.ang + .25, 1.57));
      m.ang += m.vel * dt;
      if (m.ang >= m.max) { m.ang = m.max; if (m.vel > .8) m.vel *= -.25; else { m.vel = 0; m.fini = true; } }
    }
    axeCh.set(m.dz, 0, -m.dx);
    o.quaternion.copy(qCh.setFromAxisAngle(axeCh, m.ang)).multiply(m.yaw);
    o.position.y = m.y0 + .15 * Math.sin(m.ang);
    const k = Math.exp(-3 * m.t);
    for (const l of m.membres) {   // membres qui ballottent puis se figent
      const c = k * Math.cos(l.f * m.t);
      l.o.rotation.x = l.xr + (l.x0 - l.xr) * c;
      l.o.rotation.z = l.zr + (l.z0 - l.zr) * c;
    }
    if (m.t > 18.8) o.scale.setScalar(m.s0 * Math.max(.001, (20 - m.t) / 1.2));   // disparition progressive
  }
}
function blesserEnnemi(obj, tete, dmg) {
  obj.userData.pv -= dmg;
  obj.userData.rec = .4;
  sonTouche();
  if (obj.userData.pv > 0) { montrer(tete ? "TÊTE" : "HIT", 150); return; }   // plus d'affichage des points de vie
  const P = { normal: [150, 250], petit: [200, 300], militaire: [300, 450], tank: [400, 550], boss: [1200, 1800] }[obj.userData.sorte];
  const pts = tete ? P[1] : P[0];
  score += pts;
  mourir(obj, tete);
  montrer((tete ? "HEADSHOT +" : "CORPS +") + pts, 200);
}
function essayerTir() {
  if (!controls.isLocked || fin || enRechargement || enTrainDeCourir()) return;
  const A = ARMES[armeIdx], now = performance.now() / 1000;
  if (now - dernierTir < A.delay) return;
  if (!tricheMunitions && chargeurs[armeIdx] <= 0) { lancerRechargement(); return; }
  if (!tricheMunitions) chargeurs[armeIdx]--;
  dernierTir = now; recul = A.recul; tFlash = .05;
  A.pellets > 1 ? sonPompe() : sonTir();
  const prec = (touches["control"] || touches["c"]) ? .45 : 1;
  const deja = new Set();
  for (let p = 0; p < A.pellets; p++) {
    const sx = (Math.random() - .5) * 2 * A.spread * prec;
    const sy = (Math.random() - .5) * 2 * A.spread * prec;
    raycaster.setFromCamera(new THREE.Vector2(sx, sy), camera);
    raycaster.far = 100;
    const touche = raycaster.intersectObjects([...solides, ...cibles, ...ennemis], true)[0];
    if (!touche) continue;
    let obj = touche.object;
    while (obj && !obj.userData.type) obj = obj.parent;
    if (!obj) { impact(touche); continue; }
    const tete = touche.point.y - obj.position.y > 1.55 * obj.scale.y;
    const dmg = tete ? A.dmgTete : A.dmg;
    if (obj.userData.type === "cible") {
      if (deja.has(obj)) continue;
      deja.add(obj);
      tuerCible(obj, tete);
    } else blesserEnnemi(obj, tete, dmg);
  }
  afficher();
}
document.addEventListener("mousedown", (e) => { if (e.button === 0) { clicMaintenu = true; essayerTir(); } });
document.addEventListener("mouseup", (e) => { if (e.button === 0) clicMaintenu = false; });
document.addEventListener("wheel", (e) => {
  if (!controls.isLocked || fin) return;
  changerArme((armeIdx + (e.deltaY > 0 ? 1 : ARMES.length - 1)) % ARMES.length);
});

// ---------- Boucle principale ----------
let fpsN = 0, fpsT = performance.now();
const horloge = new THREE.Clock();
function animer() {
  requestAnimationFrame(animer);
  const dt = Math.min(horloge.getDelta(), .1);
  const maintenant = performance.now();
  const dedans = !!interieurDe(camera.position.x, camera.position.z) && camera.position.y - hCam < 2 * ETAGE + .2;
  if (dedans !== dansMaison) {
    dansMaison = dedans;
    scene.fog.density = dedans ? .002 : [.045, .03, .02][Q];
    nappesBrouillard.forEach((n) => { n.sprite.visible = !dedans; });
  }
  lumieresAmbiance.forEach((l) => {
    l.lumiere.intensity = l.intensite * (1 + Math.sin(maintenant * .013 + l.phase) * l.variation);
  });
  nappesBrouillard.forEach((n) => {
    n.sprite.position.set(n.x + Math.sin(maintenant * .00012 + n.phase) * .8,
      n.y + Math.sin(maintenant * .00035 + n.phase) * .22,
      n.z + Math.cos(maintenant * .0001 + n.phase) * .5);
  });
  flammes.forEach((f) => {
    const pulse = .8 + Math.sin(maintenant * .018 + f.phase) * .15;
    f.mesh.scale.set(.8 + pulse * .25, pulse, .8 + pulse * .25);
    f.mesh.rotation.y += dt * 1.2;
    f.lumiere.intensity = 1.6 * (1 + Math.sin(maintenant * .027 + f.phase) * .35);
  });
  recul *= .85;
  const avanc = enRechargement ? Math.min(1, (performance.now() - debutRecharge) / 1200) : 0;
  const bas = Math.sin(avanc * Math.PI);   // l'arme descend puis remonte pendant le rechargement
  const courseActive = controls.isLocked && !fin && enTrainDeCourir();
  poseCourse += ((courseActive ? 1 : 0) - poseCourse) * Math.min(1, dt * 8);
  if (courseActive) phaseCourse += dt * 10;
  const balancement = Math.sin(phaseCourse), rebond = Math.abs(Math.sin(phaseCourse * 2));
  arme.position.set(
    POS_ARME.x + balancement * .045 * poseCourse,
    POS_ARME.y - bas * .25 - poseCourse * .27 + rebond * .035 * poseCourse,
    POS_ARME.z + recul + poseCourse * .12
  );
  arme.rotation.set(
    -recul * 3 - bas * .9 - poseCourse * .25,
    balancement * .1 * poseCourse,
    bas * .5 + balancement * .12 * poseCourse
  );
  tFlash -= dt; flash.visible = tFlash > 0; flash.scale.setScalar(.7 + Math.random() * .8);
  fpsN++;
  if (maintenant - fpsT > 500) { maj("fps", Math.round(fpsN * 1000 / (maintenant - fpsT))); fpsN = 0; fpsT = maintenant; }

  const tt = performance.now() / 1000;
  lumieres.forEach((l) => {
    const u = l.userData;
    if (!u.scint) return;
    u.prochainScintillement -= dt;
    u.scintillementBref = Math.max(0, u.scintillementBref - dt);
    if (u.prochainScintillement <= 0) {
      u.scintillementBref = .08 + Math.random() * .2;
      u.prochainScintillement = 3 + Math.random() * 8;
    }
    const lent = Math.sin(tt * .35 + u.phaseLente) * .025;
    const rapide = Math.sin(tt * u.vitesseScint + u.phase) * u.amplitudeScint;
    const baisse = u.scintillementBref > 0 ? .35 * (u.scintillementBref / .28) : 0;
    l.intensity = u.base * (1 + lent + rapide - baisse);
  });
  animerFumee(dt);

  if (controls.isLocked && !fin) {
    // Déplacement, collisions, hauteur (escalier / étage)
    const veutCrouch = !!(touches["control"] || touches["c"]);
    hCam += ((veutCrouch ? 1.05 : HJ) - hCam) * Math.min(1, dt * 12);
    boostVit = Math.max(0, boostVit - dt);
    const avance = !!(touches["z"] || touches["w"] || touches["s"]);
    const cote = !!(touches["q"] || touches["a"] || touches["d"]);
    let v = (veutCrouch ? 4.2 : touches["shift"] ? 8.5 : 5.2) * dt;
    if (boostVit > 0) v *= 1.35;
    if (avance && cote) v *= Math.SQRT1_2;
    if (touches["z"] || touches["w"]) controls.moveForward(v);
    if (touches["s"]) controls.moveForward(-v);
    if (touches["d"]) controls.moveRight(v);
    if (touches["q"] || touches["a"]) controls.moveRight(-v);
    let fy = camera.position.y - hCam;
    pousser(camera.position, .45, fy, hCam);
    camera.position.x = Math.max(-L + .5, Math.min(L - .5, camera.position.x));
    camera.position.z = Math.max(-L + .5, Math.min(L - .5, camera.position.z));
    const solH = hauteurSol(camera.position.x, camera.position.z, fy);
    if (touches[" "] && auSol) { vy = 7.4; auSol = false; }
    fy += vy * dt;
    vy -= 26 * dt;
    if (fy <= solH) { fy = solH; vy = 0; auSol = true; }
    else auSol = false;
    camera.position.y = fy + hCam;
    const dedans = maisonDe(camera.position.x, camera.position.z);   // brouillard léger dans les maisons
    scene.fog.density += ((dedans ? .006 : .03) - scene.fog.density) * Math.min(1, dt * 3);
    if (clicMaintenu && ARMES[armeIdx].auto) essayerTir();

    // Changement d'étage : les ennemis réapparaissent au bon niveau
    const n = fy > ETAGE - .6 ? 1 : 0;
    if (n !== niveau) {
      niveau = n;
      spawnes -= ennemis.length;
      ennemis.forEach((e) => scene.remove(e)); ennemis.length = 0;
      delaiEnnemi = 1.5; champT = 0;
    }

    if (mode === "chrono") {
      temps -= dt;
      if (temps <= 0) { temps = 0; afficher(); terminer("Temps écoulé !"); }
    } else if (pauseVague > 0) pauseVague -= dt;
    else if (tues >= nbVague()) {   // vague terminée : bonus, vague suivante
      score += 100 * vague; vague++; spawnes = 0; tues = 0; pauseVague = 4; bossCetteVague = false;
      if (vague % 3 === 1 && vies < 5) vies++;
      montrer("VAGUE " + vague + " !");
    }
    if (mode === "vagues" && pauseVague <= 0 && vague % 5 === 0 && !bossCetteVague) {
      creerBoss(); bossCetteVague = true;
    }

    animerCadavres(dt);
    // Cibles : elles se promènent au sol et rebondissent
    cibles.forEach((c) => {
      const u = c.userData;
      c.position.x += u.vx * dt; c.position.z += u.vz * dt;
      if (pousser(c.position, .5, 0) || Math.abs(c.position.x) > L - 1.5 || Math.abs(c.position.z) > L - 1.5) { u.vx *= -1; u.vz *= -1; }
      c.position.x = Math.max(-L + 1.5, Math.min(L - 1.5, c.position.x));
      c.position.z = Math.max(-L + 1.5, Math.min(L - 1.5, c.position.z));
    });

    // Ennemis : ils suivent la carte de chemins et contournent les obstacles
    const d = difficulte(), vit = 2.6 + 2.2 * d;
    champT -= dt;
    if (champT <= 0) { calculerChamp(); champT = .35; }
    delaiEnnemi -= dt;
    const maxE = mode === "vagues" ? Math.min(28, 3 + 2 * vague) : 4 + Math.round(4 * d);
    if (delaiEnnemi <= 0 && pauseVague <= 0 && ennemis.length < maxE && (mode === "chrono" || spawnes < nbVague())) {
      creerEnnemi(); delaiEnnemi = mode === "vagues" ? Math.max(.4, 2.2 - .15 * vague) : Math.max(.8, 3 - 1.5 * d);
    }
    const mp = niveau ? maisonDe(camera.position.x, camera.position.z) : null;
    for (let i = ennemis.length - 1; i >= 0; i--) {
      const e = ennemis[i], u = e.userData, ey = e.position.y;
      const cible = prochainPoint(e) || [camera.position.x, camera.position.z];
      const dx = cible[0] - e.position.x, dz = cible[1] - e.position.z;
      const lg = Math.max(Math.hypot(dx, dz), .001);
      const dist = Math.hypot(camera.position.x - e.position.x, camera.position.z - e.position.z);
      const arret = u.sorte === "militaire" && u.stop && dist < 14;   // le militaire s'arrête pour tirer
      const pas = arret ? 0 : vit * u.k * dt, nb = Math.max(1, Math.ceil(pas / .08));
      for (let p = 0; p < nb; p++) {
        e.position.x += dx / lg * pas / nb; pousser(e.position, .45, ey);
        e.position.z += dz / lg * pas / nb; pousser(e.position, .45, ey);
      }
      e.lookAt(arret ? camera.position.x : cible[0], ey, arret ? camera.position.z : cible[1]);
      animerZombie(e, dt, pas, arret);
      if (u.sorte === "militaire" || u.sorte === "boss") {
        u.tir -= dt;
        const portee = u.sorte === "boss" ? 36 : 28;
        if (u.tir <= 0 && dist < portee) {
          const o = new THREE.Vector3(e.position.x, ey + 1.3, e.position.z);
          const dir = new THREE.Vector3(camera.position.x, camera.position.y - .3, camera.position.z).sub(o), lon = dir.length();
          dir.normalize();
          raycaster.set(o, dir); raycaster.far = lon;
          u.stop = !raycaster.intersectObjects(solides, false).length;   // ligne de vue dégagée ?
          if (u.stop) { tirerBalle(o.addScaledVector(dir, .6), dir); u.tir = u.sorte === "boss" ? 1.1 + Math.random() * .4 : 2 + Math.random(); u.rec = .5; } else u.tir = .5;
        }
      }

      // Bloqué derrière un mur depuis 2 s : il réapparaît ailleurs
      u.t = (u.t || 0) + dt;
      if (u.t > 2) {
        if (u.px !== undefined && Math.hypot(e.position.x - u.px, e.position.z - u.pz) < .6) {
          const [x, z, f] = placer(mp ? 5 : 20, mp); e.position.set(x, f, z);
        }
        u.t = 0; u.px = e.position.x; u.pz = e.position.z;
      }

      if (dist < 1.1 + .45 * e.scale.y && Math.abs(ey - fy) < 1.5) {
        scene.remove(e); ennemis.splice(i, 1); tues++;
        if (!tricheInvincible) {
          vies--; sonDegat();
          degats.style.opacity = 1;
          setTimeout(() => (degats.style.opacity = 0), 150);
          if (vies <= 0) { afficher(); terminer("Tu as été éliminé !"); break; }
        }
      }
    }
    for (let i = projectiles.length - 1; i >= 0 && !fin; i--) {
      const b = projectiles[i], q = b.userData, p = b.position;
      let fini = (q.vie -= dt) <= 0;
      for (let k = 0; k < 2 && !fini; k++) {   // 2 sous-pas : pas de traversée des murs fins
        p.addScaledVector(q.v, dt / 2);
        fini = p.y < 0 || proches(p.x, p.z).some((o) => p.y > o.minY && p.y < o.maxY && p.x > o.minX && p.x < o.maxX && p.z > o.minZ && p.z < o.maxZ);
      }
      const atteint = !fini && Math.hypot(p.x - camera.position.x, p.z - camera.position.z) < .6 && p.y > camera.position.y - hCam && p.y < camera.position.y + .2;
      if (fini || atteint) { scene.remove(b); projectiles.splice(i, 1); }
      if (atteint && blesser()) break;
    }
    const tBob = performance.now() / 1000;
    for (const p of pickups) {
      if (p.userData.mort) continue;
      p.rotation.y += dt * 1.6;
      p.position.y = p.userData.fy + .55 + Math.sin(tBob * 3 + p.position.x) * .12;
      if (Math.hypot(p.position.x - camera.position.x, p.position.z - camera.position.z) < 1.2 && Math.abs((camera.position.y - hCam) - p.userData.fy) < 1.4) {
        p.userData.mort = true; p.visible = false; sonBonus();
        const tp = p.userData.type;
        if (tp === "soin") { vies = Math.min(5, vies + 1); montrer("SOIN +1", 900); }
        else if (tp === "munitions") {
          reserves[0] += 24; reserves[1] += 6;
          montrer("MUNITIONS", 900);
        } else { boostVit = 8; montrer("VITESSE !", 900); }
        const ud = p.userData;
        setTimeout(() => {
          p.position.set(ud.x, ud.fy + .55, ud.z);
          p.visible = true; p.userData.mort = false;
        }, 16000);
      }
    }
    afficher();
  }
  renderer.render(scene, camera);
}
animer();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
